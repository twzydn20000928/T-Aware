<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-labelledby="title desc">
  <title id="title">T-Aware Architecture</title>
  <desc id="desc">A passage is encoded by RoBERTa. A classification head predicts human or AI for every example. An auxiliary temperature head is supervised on AI examples only during training.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <linearGradient id="encoder" x2="1" y2="1"><stop stop-color="#eef2ff"/><stop offset="1" stop-color="#e0e7ff"/></linearGradient>
  </defs>
  <rect width="1120" height="350" rx="20" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="38" y="40" font-size="12" letter-spacing="2" font-weight="700" fill="#64748b">T-AWARE / TEMPERATURE-SUPERVISED DETECTION</text>
    <rect x="36" y="123" width="174" height="112" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <path d="M60 150h28m-28 9h58m-58 9h48" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <text x="60" y="198" font-size="20" font-weight="700" fill="#0f172a">Input passage</text>
    <text x="60" y="219" font-size="13" fill="#64748b">Text only</text>
    <path d="M210 179H270" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="278" y="104" width="230" height="150" rx="16" fill="url(#encoder)" stroke="#a5b4fc"/>
    <text x="393" y="151" text-anchor="middle" font-size="13" font-weight="700" fill="#6366f1">SHARED ENCODER</text>
    <text x="393" y="184" text-anchor="middle" font-size="25" font-weight="700" fill="#1e1b4b">RoBERTa-base</text>
    <text x="393" y="214" text-anchor="middle" font-size="14" fill="#475569">First-token representation</text>
    <path d="M508 179H548V117H591" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M548 179V251H591" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="601" y="73" width="238" height="91" rx="13" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="621" y="107" font-size="19" font-weight="700" fill="#065f46">Classification head</text>
    <text x="621" y="136" font-size="14" fill="#047857">Cross-entropy / all examples</text>
    <path d="M839 117H886" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="896" y="80" width="188" height="75" rx="12" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="990" y="111" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Human or AI</text>
    <text x="990" y="136" text-anchor="middle" font-size="13" fill="#047857">Used at inference</text>
    <rect x="601" y="206" width="238" height="91" rx="13" fill="#fffbeb" stroke="#fcd34d" stroke-dasharray="6 4"/>
    <text x="621" y="240" font-size="19" font-weight="700" fill="#92400e">Temperature head</text>
    <text x="621" y="269" font-size="14" fill="#a16207">Masked MSE / AI examples</text>
    <path d="M839 251H886" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <rect x="896" y="214" width="188" height="75" rx="12" fill="#ffffff" stroke="#fde68a" stroke-dasharray="6 4"/>
    <text x="990" y="245" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Temperature</text>
    <text x="990" y="270" text-anchor="middle" font-size="13" fill="#a16207">Training supervision</text>
    <text x="38" y="322" font-size="13" fill="#64748b">Temperature supervision shapes the shared encoder. Detection requires no temperature label.</text>
  </g>
</svg>
